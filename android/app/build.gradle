// The gradle project's shape follows daijro's honeydew (GPL-3.0-or-later), https://github.com/daijro/honeydew.
plugins {
    id 'com.android.application' version '8.13.2'
}

def version = (file('../../Cargo.toml').text =~ /(?m)^version = "(\d+)\.(\d+)\.(\d+)"$/)[0]
def (major, minor, patch) = version[1..3].collect { it.toInteger() }
assert minor < 1000 && patch < 1000
layout.buildDirectory = file('../../target/android')

android {
    namespace = 'dev.apikun.mangostudio'
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    ndkVersion = '28.1.13356709'

    defaultConfig {
        applicationId = 'dev.apikun.mangostudio'
        minSdk = 26
        targetSdk = 36
        versionCode = major * 1000000 + minor * 1000 + patch
        versionName = "${major}.${minor}.${patch}"
        resValue 'string', 'app_name', 'Mango Studio'
        ndk { abiFilters 'arm64-v8a' }
    }

    // The committed keystore signs both builds, so an update installs over the last one. It is a public
    // build identity (the passwords are in the repository): a real release keystore goes through
    // environment variables when the project wants one.
    signingConfigs {
        main {
            storeFile = rootProject.file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
            resValue 'string', 'app_name', 'Mango Studio Debug'
            signingConfig = signingConfigs.main
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.main
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = [layout.buildDirectory.dir('jniLibs')]
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}

tasks.register('verifyNativeInputs') {
    doLast {
        for (path in ['jniLibs/arm64-v8a/libos_android.so']) {
            if (!layout.buildDirectory.file(path).get().asFile.isFile()) {
                throw new GradleException("Missing ${path}; build with tools/android-dist.sh")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNativeInputs' }
