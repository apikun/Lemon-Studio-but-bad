# Builds Mango Studio for Windows and Linux and attaches the portable builds to a GitHub release: a `v*` tag pushed to
# the repository (or a manual dispatch) becomes a release with `Mango-Studio-windows-x64.zip` and
# `Mango-Studio-linux-x64.zip`. The builds are the ones CI checks (see ci.yml): Windows 10+, x64 — the build Winlator
# (Wine on Android) runs, since nothing needs the GPU — and Linux on X11 or Wayland, x64.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, created if it does not exist (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The Windows image ships LLVM, whose libclang generates the time stretcher's and the ASIO SDK's bindings.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p os-app

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/mangostudio.exe dist/
          Copy-Item README.md dist/
          Copy-Item THIRD-PARTY-NOTICES.txt dist/
          Compress-Archive -Path dist/* -DestinationPath Mango-Studio-windows-x64.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Mango Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            Mango Studio for Windows (x64) and Linux (x64): the portable builds that run on Windows 10 and 11, Linux on
            X11 or Wayland, and under Wine — for example Winlator on Android.

            Mango Studio is based on Lemon Studio by ItsAlphaNeon (https://github.com/ItsAlphaNeon/Lemon-Studio), free software
            under the GPL 3.0 or later.

            - Unzip and run `mangostudio` (`mangostudio.exe` on Windows): no installer, and nothing else to install.
            - v0.2: the new Mango Acid (an acid bass, the roadmap's Transistor Bass) joins the instruments, and on a
              narrow window the top band scales down to fit, so the output monitor's waveform display stays visible
              (the Wine and Winlator reports).
            - On Winlator, see the README's "Winlator (Android)" section: shared audio mode, Buffer length 1024.
            - If it will not start, `%APPDATA%\Mango Studio\panic-log.txt` says why.
          files: Mango-Studio-windows-x64.zip
          fail_on_unmatched_files: true

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libclang for the time stretcher's bindings, ALSA's and Wayland's development files for the build (as ci.yml).
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p os-app

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/mangostudio dist/
          cp README.md dist/
          cp THIRD-PARTY-NOTICES.txt dist/
          zip -r Mango-Studio-linux-x64.zip dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Mango Studio ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body: |
            Mango Studio for Windows (x64) and Linux (x64): the portable builds that run on Windows 10 and 11, Linux on
            X11 or Wayland, and under Wine — for example Winlator on Android.

            Mango Studio is based on Lemon Studio by ItsAlphaNeon (https://github.com/ItsAlphaNeon/Lemon-Studio), free software
            under the GPL 3.0 or later.

            - Unzip and run `mangostudio` (`mangostudio.exe` on Windows): no installer, and nothing else to install.
            - v0.2: the new Mango Acid (an acid bass, the roadmap's Transistor Bass) joins the instruments, and on a
              narrow window the top band scales down to fit, so the output monitor's waveform display stays visible
              (the Wine and Winlator reports).
            - On Winlator, see the README's "Winlator (Android)" section: shared audio mode, Buffer length 1024.
            - If it will not start, `%APPDATA%\Mango Studio\panic-log.txt` says why.
          files: Mango-Studio-linux-x64.zip
          fail_on_unmatched_files: true
