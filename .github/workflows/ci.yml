# Builds and tests Lemon Studio on Windows, Linux and macOS for every push to main and every pull request, so a change
# that breaks any platform shows up before it is merged.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libwayland-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: cargo run -p bundle-app --locked

      # Every platform's crates: the notices test lists them with an offline `cargo tree --target all`.
      - name: Fetch
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked

  # The Android port (crates/os-android + os-app's lib): a check, so the mobile build cannot rot while
  # desktop work lands. The APK itself is built by release.yml (and tools/android-dist.sh locally).
  android:
    name: Android arm64 (check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The NDK (r28b) and its licence; the image's SDK provides the rest.
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: |
          export TC=$ANDROID_HOME/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/bin/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=$TC/bin/aarch64-linux-android26-clang
          export CXX_aarch64_linux_android=$TC/bin/aarch64-linux-android26-clang++
          export AR_aarch64_linux_android=$TC/bin/llvm-ar
          unset CPATH BINDGEN_EXTRA_CLANG_ARGS C_INCLUDE_PATH CPLUS_INCLUDE_PATH
          cargo check --workspace --target aarch64-linux-android --locked
