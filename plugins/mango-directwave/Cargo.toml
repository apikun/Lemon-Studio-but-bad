[package]
name = "mango-directwave"
description = "Mango DirectWave: Mango Studio's sampler as a VST3 / CLAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Compiled into Mango Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = ["lemon-sampler/linked"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
os-engine.workspace = true
os-model.workspace = true
os-hostlink.workspace = true
os-plugkit = { path = "../../crates/os-plugkit" }
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
# The sampler's voices (its resampler, envelopes, filter and declicks) play the zones.
lemon-sampler = { path = "../lemon-sampler", features = ["linked"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

# The open sample dialog (Windows has its own).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tiny-skia = "0.11"
