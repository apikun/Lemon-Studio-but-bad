[package]
name = "mango-soundfont"
description = "Mango Studio's SF2 SoundFont instrument"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
crossbeam-queue = "0.3"
os-plugkit = { path = "../../crates/os-plugkit" }
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
rustysynth = "1.3.8"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tiny-skia = "0.11"
