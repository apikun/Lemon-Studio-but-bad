[package]
name = "lemon-wavetable"
description = "Mango Wavetable: Mango Studio's wavetable synthesizer as a VST3 / CLAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
os-plugkit = { path = "../../crates/os-plugkit" }
os-hostlink.workspace = true
os-ui = { path = "../../crates/os-ui" }
os-theme = { path = "../../crates/os-theme" }
