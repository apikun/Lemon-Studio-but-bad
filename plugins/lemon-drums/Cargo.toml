[package]
name = "lemon-drums"
description = "Mango Drums: Mango Studio's synthesized drum voice as a VST3 / CLAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Compiled into Mango Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-gen = { path = "../lemon-small-gen" }
os-plugkit = { path = "../../crates/os-plugkit" }
